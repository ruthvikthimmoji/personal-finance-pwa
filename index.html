<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Finance" />
    <meta name="theme-color" content="#FAF8F5" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/svg+xml" href="/icon-192.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>Personal Finance Tracker</title>
  </head>
  <body class="bg-[#FAF8F5] text-[#111827] antialiased overscroll-none min-h-screen">
    <div id="root">
      <div style="position: fixed; inset: 0; background-color: #FAF8F5; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: 'Inter', -apple-system, sans-serif;">
        <div style="width: 112px; height: 112px; border-radius: 28px; background: #ffffff; border: 1px solid #E8E3DA; box-shadow: 0 20px 30px rgba(0,0,0,0.04); display: flex; align-items: center; justify-content: center; padding: 20px;">
          <img src="/logo-mark.png" alt="Personal Finance Logo" style="width: 100%; height: 100%; object-fit: contain;" />
        </div>
        <div style="font-size: 24px; font-weight: 700; color: #111827; margin-top: 24px; letter-spacing: -0.02em;">Personal Finance</div>
        <div style="font-size: 11px; font-weight: 600; color: #5E6A75; margin-top: 6px; letter-spacing: 0.2em; text-transform: uppercase;">Private · Calm · Real-time</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((err) => {
            console.log('SW registration failed: ', err);
          });
        });
      }
    </script>
  </body>
</html>
