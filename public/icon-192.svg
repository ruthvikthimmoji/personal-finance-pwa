<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#022c22"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  
  <!-- Subtle border -->
  <rect width="510" height="510" x="1" y="1" rx="127" fill="none" stroke="rgba(52, 211, 153, 0.3)" stroke-width="2"/>
  
  <!-- Glowing circle ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#gold)" stroke-width="12" opacity="0.3" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#gold)" stroke-width="10" stroke-dasharray="800 200"/>

  <!-- Center Rupee Symbol -->
  <text x="256" y="320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="200" font-weight="800" text-anchor="middle" fill="#ecfdf5" filter="url(#glow)">₹</text>

  <!-- Accent stars/dots -->
  <circle cx="370" cy="150" r="12" fill="#34d399" filter="url(#glow)"/>
  <circle cx="140" cy="360" r="8" fill="#10b981" opacity="0.7"/>
</svg>
