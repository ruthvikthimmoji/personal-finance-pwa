<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="ivoryBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F5"/>
      <stop offset="100%" stop-color="#F2EFE9"/>
    </linearGradient>
  </defs>
  <!-- Background Rounded Rect in warm Ivory -->
  <rect width="512" height="512" rx="128" fill="url(#ivoryBg)"/>
  
  <!-- Subtle border -->
  <rect width="510" height="510" x="1" y="1" rx="127" fill="none" stroke="#E8E3DA" stroke-width="2"/>

  <!-- Logo Mark image -->
  <image href="/logo-mark.png" x="80" y="80" width="352" height="352" preserveAspectRatio="xMidYMid meet" />
</svg>