<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F5"/>
      <stop offset="100%" stop-color="#F2EFE9"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A73E8"/>
      <stop offset="100%" stop-color="#0F62FE"/>
    </linearGradient>
  </defs>
  <!-- Background Rounded Rect in warm Ivory -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  
  <!-- Subtle border -->
  <rect width="510" height="510" x="1" y="1" rx="127" fill="none" stroke="#E8E3DA" stroke-width="3"/>
  
  <!-- Primary Blue Ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#primaryGrad)" stroke-width="12" opacity="0.15"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#primaryGrad)" stroke-width="10" stroke-dasharray="750 250"/>

  <!-- Center Rupee Symbol in Deep Fintech Charcoal -->
  <text x="256" y="322" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="200" font-weight="700" text-anchor="middle" fill="#111827">₹</text>

  <!-- Accent dot in primary blue -->
  <circle cx="370" cy="150" r="14" fill="#1A73E8"/>
  <circle cx="140" cy="360" r="10" fill="#16A34A"/>
</svg>
