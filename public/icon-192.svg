<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1B2A"/>
      <stop offset="50%" stop-color="#132238"/>
      <stop offset="100%" stop-color="#1B2D4A"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2BC48A"/>
      <stop offset="50%" stop-color="#1A73E8"/>
      <stop offset="100%" stop-color="#1558B0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  
  <!-- Subtle border -->
  <rect width="510" height="510" x="1" y="1" rx="127" fill="none" stroke="rgba(26, 115, 232, 0.35)" stroke-width="2"/>
  
  <!-- Glowing circle ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#primaryGrad)" stroke-width="12" opacity="0.3" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#primaryGrad)" stroke-width="10" stroke-dasharray="800 200"/>

  <!-- Center Rupee Symbol in Soft Gray -->
  <text x="256" y="320" font-family="'Instagram Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="200" font-weight="800" text-anchor="middle" fill="#E6E9EC" filter="url(#glow)">₹</text>

  <!-- Accent fresh green and primary blue dots -->
  <circle cx="370" cy="150" r="12" fill="#2BC48A" filter="url(#glow)"/>
  <circle cx="140" cy="360" r="8" fill="#1A73E8" opacity="0.8"/>
</svg>
